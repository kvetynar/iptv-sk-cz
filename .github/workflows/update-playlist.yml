name: Update SK CZ playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build combined playlist
        run: python scripts/build_playlist.py
      - name: Commit changed playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sk-cz.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SK and CZ IPTV playlist"
            git push
          fi
